; TAStore — php-fpm dans un conteneur nginx + PHP.
;
; `pm = dynamic` avec une petite pool : l'offre gratuite de Render alloue
; 512 Mo au conteneur, et chaque worker PHP-FPM consomme de la mémoire. Une
; pool plus large ferait swapping, donc des timeouts.
[www]
user = www-data
group = www-data

; Doit correspondre EXACTEMENT au `fastcgi_pass` de docker/nginx.conf, qui
; est en TCP et non sur une socket. Avec une socket ici et `fastcgi_pass
; 127.0.0.1:9000` là-bas, rien n'écoutait sur le port : chaque requête se
; soldait par un 502 alors que les deux fichiers semblaient corrects.
listen = 127.0.0.1:9000
; Une socket Unix dans le même conteneur serait plus rapide, mais elle
; impose de faire correspondre listen.owner/group au `user` des workers
; nginx sous peine de permission refusée sur le socket.
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
; Tuer un worker qui dépasse 180 s évite qu'une requête bloquée (verrou de
; base, appel réseau) occupe un des 10 slots indéfiniment.
; Le_directeur s'appelle `request_terminate_timeout` : `pm.max_request_time`
; n'existe pas et php-fpm refuse de démarrer dessus ("unknown entry"), ce qui
; coûtait le conteneur entier — le nom voisine `pm.max_requests` est un
; NOMBRE de requêtes, pas une durée, d'où la confusion.
request_terminate_timeout = 180

; Les erreurs applicatives doivent remonter dans les logs Render, pas dans
; un fichier inaccessible depuis le tableau de bord.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
