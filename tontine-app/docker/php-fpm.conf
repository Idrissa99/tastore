; TAStore — pool PHP-FPM.
;
; `listen` sur 0.0.0.0 serait inutile ici : nginx et PHP-FPM partagent le
; même conteneur et se parlent sur la boucle locale. L'écoute publique est
; assurée par nginx (voir docker/nginx.conf).

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Une requête qui dépasse ce délai est tuée et tracée dans les logs :
; diagnosing un blocage est alors possible au lieu de voir des requêtes
; s'empiler silencieusement.
request_terminate_timeout = 60s

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
