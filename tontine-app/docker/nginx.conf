# TAStore — API Laravel servie par nginx.
#
# `listen` est réécrit au démarrage par docker/start.sh avec la valeur de
# $PORT fournie par Render : le port n'est PAS supposé être 8000 (Render
# impose par défaut 10000, et le service est reconfigurable à tout moment).

server {
    listen 8000;
    listen [::]:8000;

    server_name _;
    root /var/www/html/public;

    charset utf-8;
    client_max_body_size 64M;

    # Compression : les réponses de l'API sont du JSON, très compressible.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml;

    # En-têtes de sécurité. L'API ne sert pas de HTML interactif, mais
    # `/storage/…` est affiché directement dans la page React : le
    # `X-Content-Type-Options` évite qu'un fichier téléversé soit
    # interprété comme du HTML par le navigateur.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les fichiers de /storage sont servis par php-fpm via Laravel, ce qui est
    # lent et cassait les vignettes produits. On les sert en direct.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Nécessaire pour que Laravel voie le vrai schéma/proto/port
        # transmis par le proxy de Render — mais uniquement parce que
        # TRUSTED_PROXIES est défini côté application.
        fastcgi_param HTTP_PROXY "";
    }

    # Fichiers statiques servis directement par nginx, jamais par PHP.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Fichiers interdiction d'accès direct.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
