; TAStore — réglages PHP pour un conteneur web.
; Les valeurs qui influent sur la sécurité des fichiers téléversés sont
; alignées sur docker/nginx.conf (client_max_body_size = 64M).

memory_limit = 256M
max_execution_time = 60

; Photos de produits et vidéos envoyées depuis l'espace commerçant.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

expose_php = Off

[Session]
session.use_strict_mode = 1
session.cookie_httponly = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
; Render arrête l'instance après 15 min d'inactivité : un conteneur neuf ne
; peut pas vérifier quoi que ce soit en mémoire. TTL de 60 s, pas 0.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
