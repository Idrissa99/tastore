# ---------------------------------------------------------------------------
# TAStore — Render Blueprint (environnement de TEST)
#
# Ce fichier est lu par Render UNIQUEMENT lors de la création du service
# depuis le tableau de bord : Dashboard > New > Blueprint.
#
# Il ne contient AUCUN secret. Les secrets sont déclarés `sync: false` :
# Render les demandera dans le tableau de bord au moment de la création, et
# ne les écrira jamais dans GitHub.
#
# Documentation : https://render.com/docs/blueprint-spec
# ---------------------------------------------------------------------------

services:
  - type: web
    name: tastore-api

    # Render n'a pas de runtime PHP natif : le seul moyen de déployer
    # Laravel est une image Docker. Cf. tontine-app/Dockerfile.
    runtime: docker

    # Monorepo : le Dockerfile est à la racine de tontine-app/ et le contexte
    # de build doit être CE dossier. Sans `dockerContext`, Render verrait le
    # dépôt entier en contexte et le COPY . . de l'image embarquerait les deux
    # autres applications.
    #
    # `dockerContext` est ici relatif à la RACINE du dépôt, donc AUCUN
    # `rootDir` ne doit être défini : Render concatène les deux et résout
    # `tontine-app` + `./tontine-app` = `tontine-app/tontine-app`. Le build
    # échoue alors avant même de commencer :
    #   error: invalid local: resolve : lstat
    #   /opt/render/project/src/tontine-app/tontine-app: no such file or directory
    # Perte acceptable : `rootDir` ne servait qu'à limiter les builds
    # automatiques aux fichiers de tontine-app/ (buildFilter fait le même
    # travail, sans ce risque de doublage).
    dockerfilePath: ./tontine-app/Dockerfile
    dockerContext: ./tontine-app

    plan: free
    # Modifiable uniquement à la création. Francfort est le plus proche de
    # l'Afrique de l'Ouest parmi les régions Render.
    region: frankfurt

    # /up ne teste que le processus PHP : l'orchestrateur ne doit pas tuer le
    # conteneur parce que la base met une seconde à répondre.
    healthCheckPath: /up

    envVars:
      # --- Application ------------------------------------------------------
      - key: APP_NAME
        value: TAStore
      - key: APP_ENV
        value: production
      # IMPÉRATIF : les stack traces exposent l'arborescence, la configuration
      # et les variables d'environnement. Le garde-fou application journalise
      # une alerte critique si APP_DEBUG=true en production.
      - key: APP_DEBUG
        value: "false"
      # URL de l'API elle-même. Sert notamment à construire les URL des
      # images produits (config/filesystems.php) : si elle est fausse, aucune
      # photo ne s'affiche jamais.
      # ⚠ À REMPLACER par l'URL réelle que Render attribue au service.
      - key: APP_URL
        value: https://tastore-api.onrender.com
      # `sync: false` -> Render la demande à la création.
      # Générer la valeur avec : php artisan key:generate --show
      # Ne JAMAIS utiliser une valeur de développement : elle est dans le
      # dépôt local et sur le canal de discussion.
      - key: APP_KEY
        sync: false

      # --- Base de données (MySQL) ------------------------------------------
      # ⚠ MySQL N'EST PAS FOURNI PAR RENDER. Ces cinq variables sont
      # `sync: false` : il faut un MySQL managé gratuit PARTOUT ailleurs.
      #
      #   Aiven  : aiven.io/free-mysql-database — 1 Go, sans carte
      #            bancaire, sans expiration. Console > Create service >
      #            MySQL > Plan `Free`. Les paramètres de connexion sont
      #            dans Overview > Connection information.
      #   TiDB   : cloud.tidb.com — compatible MySQL, offre Starter
      #            gratuite, mais le port et le TLS diffèrent.
      #   Oracle : MySQL HeatWave Always Free — le plus généreux (50 Go)
      #            mais l'inscription demande une carte et peut être
      #            rejetée si l'adresse n'est pas dans une région éligible.
      #
      # ⚠ MySQL 8.0.16 minimum : avant cette version, les contraintes CHECK
      #   sont ACCEPTÉES puis IGNORÉES, et la migration 2026_09_28_000002
      #   croirait avoir protégé les montants alors que non.
      - key: DB_CONNECTION
        value: mysql
      # Hôte, port, nom de base, utilisateur et mot de passe : les CINQ
      # viennent de l'hébergeur MySQL, Render ne peut pas les inventer.
      #
      # DB_PORT et DB_DATABASE sont `sync: false` pour une raison précise :
      # Aiven attribue un PORT ALÉATOIRE (12xxx, 24xxx…) et nomme la base
      # `defaultdb`. Un `3306` et un `tontine` codés en dur feraient échouer
      # la migration avec « connection refused » ou « unknown database », et
      # l'erreur est noyée dans les logs du build.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Le charset par défaut de config/database.php est déjà utf8mb4, mais
      # on le fixe explicitement : une base créée en latin1 refuse les accents
      # et les emojis des noms de produits.
      - key: DB_CHARSET
        value: utf8mb4
      - key: DB_COLLATION
        value: utf8mb4_unicode_ci

      # --- Cache / session / file d'attente -------------------------------
      # Sur une base unique et un service unique, le pilote `database` est
      # suffisant et gratuit.
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      # Un changement de mot de passe invalide les AUTRES sessions.
      - key: SESSION_REVOKE_OTHERS_ON_PASSWORD_CHANGE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database

      # --- Fichiers et proxy ----------------------------------------------
      - key: FILESYSTEM_DISK
        value: local
      # Render termine le TLS et transmet du HTTP au conteneur : sans cette
      # confiance, Laravel croit la requête en HTTP (URLs, cookies `secure`).
      # Seul Render atteint le conteneur, donc le "*" n'ouvre à personne.
      - key: TRUSTED_PROXIES
        value: "*"

      # --- Frontend / CORS -------------------------------------------------
      # ORIGINE du SPA React, PAS celle de l'API. Sans cette variable,
      # l'application refuse de démarrer en production (AppServiceProvider
      # lève une exception si la liste CORS est vide).
      # ⚠ À REMPLACER par le vrai domaine Vercel (le projet « tastore » est
      #   déjà pris sur Vercel, le tien aura donc un autre nom).
      - key: FRONTEND_URL
        value: https://tastore.vercel.app
      - key: FRONTEND_URLS
        value: ""
      - key: CORS_MAX_AGE
        value: "0"

      # --- Authentification (Sanctum, tokens Bearer) ------------------------
      # 43200 minutes = 30 jours. Jamais 0 (tokens sans expiration) en
      # production.
      - key: SANCTUM_TOKEN_EXPIRATION
        value: "43200"
      - key: SANCTUM_TOKEN_NAME
        value: spa

      # --- Journalisation --------------------------------------------------
      - key: LOG_CHANNEL
        value: stack
      # "daily" obligatoire : "single" écrit un fichier unique qui grossit
      # sans limite et remplit le disque.
      - key: LOG_STACK
        value: daily
      - key: LOG_LEVEL
        value: info
      - key: LOG_DAILY_DAYS
        value: "7"

      # --- Paiements -------------------------------------------------------
      # AUCUN fournisseur Mobile Money réel n'est intégré. En production le
      # faux fournisseur refuse de s'exécuter : les paiements par code de
      # transfert restent utilisables, le paiement automatique non.
      - key: PAYMENT_PROVIDER
        value: fake
      - key: PAYMENT_ALLOW_FAKE_IN_PRODUCTION
        value: "false"
      - key: PAYMENT_CURRENCY
        value: XOF
      # TAUX FIGÉ : 0.07 = 7 %. Le repli de config/commissions.php est 0.03,
      # et la table `settings` est VIDE sur une base neuve : sans cette
      # variable, toutes les commissions seraient calculées à 3 %.
      - key: COMMISSION_RATE
        value: "0.07"

      # Secret de signature des webhooks. `sync: false` : à définir, sinon
      # TOUS les webhooks sont rejetés en 503.
      - key: MOBILEMONEY_WEBHOOK_SECRET
        sync: false

      # --- Mail ------------------------------------------------------------
      # "log" : aucun SMTP n'est configuré. Les e-mails de réinitialisation
      # de mot de passe sont écrits dans les logs du service (Dashboard >
      # Logs) au lieu d'être envoyés. Suffisant pour un test.
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: no-reply@tastore.test
      - key: MAIL_FROM_NAME
        value: TAStore
